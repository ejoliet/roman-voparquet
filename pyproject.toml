[project]
name = "roman-voparquet"
version = "0.1.0"
description = "Convert Roman-datamodel Parquet catalogs into VOParquet 1.0 by embedding a data-less VOTable header."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Emmanuel Joliet", email = "ejoliet@ipac.caltech.edu" }]
keywords = ["VOParquet", "VOTable", "Roman", "IVOA", "parquet", "astronomy"]
dependencies = [
    "pyarrow>=17.0",
    "astropy>=6.0",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "numpy>=1.26",
]

[project.scripts]
roman-voparquet = "roman_voparquet.cli:app"

[project.urls]
Homepage = "https://github.com/ejoliet/roman-voparquet"
Specification = "https://www.ivoa.net/documents/Notes/VOParquet/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roman_voparquet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
